<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>AR + AI FIXED</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#overlay {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:white;
  padding:10px 16px;
  border-radius:8px;
  z-index:10;
}

video {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
  opacity:0; /* skryté, ale aktivní */
}
</style>
</head>

<body>

<div id="overlay">Načítám AI + AR...</div>
<video id="video" autoplay playsinline></video>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let scene, camera, renderer;
let model;
let labels = [];

init();

async function init() {

  // ===== CAMERA STREAM (KLÍČOVÉ FIX) =====
  const video = document.getElementById('video');
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  video.srcObject = stream;

  // ===== AR =====
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  document.body.appendChild(ARButton.createButton(renderer));

  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

  model = await cocoSsd.load();
  overlay("AI ready");

  renderer.setAnimationLoop(render);

  aiLoop(video);
}

// ===== AI LOOP =====
async function aiLoop(video) {

  if (!model) return;

  const predictions = await model.detect(video);

  labels.forEach(l => scene.remove(l));
  labels = [];

  predictions.forEach(p => {

    if (p.score < 0.6) return;

    const centerX = (p.bbox[0] + p.bbox[2]/2) / video.videoWidth;
    const centerY = (p.bbox[1] + p.bbox[3]/2) / video.videoHeight;

    const pos = projectTo3D(centerX, centerY);

    const label = createLabel(p.class + " " + Math.round(p.score*100) + "%");
    label.position.copy(pos);

    scene.add(label);
    labels.push(label);
  });

  setTimeout(()=>aiLoop(video), 500);
}

// ===== PROJECTION =====
function projectTo3D(x,y) {

  const vec = new THREE.Vector3(
    (x*2-1),
    -(y*2-1),
    0.5
  );

  vec.unproject(camera);

  const dir = vec.sub(camera.position).normalize();

  return camera.position.clone().add(dir.multiplyScalar(2));
}

// ===== LABEL =====
function createLabel(text) {

  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "black";
  ctx.fillRect(0,0,256,128);

  ctx.fillStyle = "white";
  ctx.font = "24px Arial";
  ctx.fillText(text, 10, 64);

  const texture = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: texture })
  );

  sprite.scale.set(0.5,0.25,1);

  return sprite;
}

function overlay(t) {
  document.getElementById('overlay').innerText = t;
}

function render() {
  renderer.render(scene, camera);
}
</script>

</body>
</html>
