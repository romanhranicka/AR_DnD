<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>AR AI Labels</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#overlay {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:white;
  padding:10px 16px;
  border-radius:8px;
  z-index:10;
}
</style>
</head>

<body>

<div id="overlay">Načítám AI...</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let scene, camera, renderer;
let controller;

let model;
let labels = [];

init();

async function init() {

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  document.body.appendChild(ARButton.createButton(renderer));

  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

  // XR controller
  controller = renderer.xr.getController(0);
  scene.add(controller);

  // načtení modelu
  model = await cocoSsd.load();
  overlay("AI připravena – skenuji objekty");

  renderer.setAnimationLoop(render);

  detectLoop();
}

// ===== AI LOOP =====
async function detectLoop() {

  const video = renderer.domElement;

  if (!model) return;

  const predictions = await model.detect(video);

  // smaž staré labely
  labels.forEach(l => scene.remove(l));
  labels = [];

  predictions.forEach(p => {

    if (p.score < 0.6) return;

    const x = (p.bbox[0] + p.bbox[2]/2) / window.innerWidth;
    const y = (p.bbox[1] + p.bbox[3]/2) / window.innerHeight;

    const pos = screenToWorld(x, y);

    const label = createLabel(p.class);
    label.position.copy(pos);

    scene.add(label);
    labels.push(label);
  });

  setTimeout(detectLoop, 300); // ~3 FPS
}

// ===== SCREEN → 3D =====
function screenToWorld(x, y) {
  const vector = new THREE.Vector3(
    (x * 2 - 1),
    -(y * 2 - 1),
    0.5
  );

  vector.unproject(camera);

  const dir = vector.sub(camera.position).normalize();
  return camera.position.clone().add(dir.multiplyScalar(2));
}

// ===== LABEL =====
function createLabel(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "white";
  ctx.font = "28px Arial";
  ctx.fillText(text, 10, 64);

  const texture = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: texture })
  );

  sprite.scale.set(0.5,0.25,1);

  return sprite;
}

function overlay(t) {
  document.getElementById('overlay').innerText = t;
}

function render() {
  renderer.render(scene, camera);
}
</script>

</body>
</html>
