<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>AR Room Scan</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#overlay {
  position:absolute; top:20px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:white; padding:10px 16px;
  border-radius:8px;
  z-index:10;
}

#scanBtn {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  padding:14px 24px;
  background:#00c896;
  color:white;
  border:none;
  border-radius:8px;
  z-index:10;
}
</style>
</head>

<body>

<div id="overlay">Spusť AR</div>
<button id="scanBtn">Start scan</button>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let scene, camera, renderer;
let reticle, grid;

let hitTestSource = null;
let hitTestSourceRequested = false;

let scanning = false;
let points = [];
let line = null;

init();

function init() {

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  document.body.appendChild(ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test','local-floor']
  }));

  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

  const geo = new THREE.RingGeometry(0.08,0.1,32);
  geo.rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0x00ffaa}));
  reticle.matrixAutoUpdate=false;
  reticle.visible=false;
  scene.add(reticle);

  grid = new THREE.GridHelper(1,10,0x00ffaa,0x00ffaa);
  grid.visible=false;
  scene.add(grid);

  document.getElementById("scanBtn").onclick = toggleScan;

  renderer.setAnimationLoop(render);
}

function toggleScan() {
  scanning = !scanning;

  if (!scanning) {
    finishScan();
  } else {
    points = [];
    overlay("Skenuji… choď pomalu kolem místnosti");
  }
}

function addPoint(pos) {

  // filtr – ukládej jen když je bod dost daleko
  if (points.length > 0) {
    const last = points[points.length - 1];
    if (pos.distanceTo(last) < 0.3) return;
  }

  points.push(pos.clone());

  // vizualizace bodu
  const dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.02),
    new THREE.MeshBasicMaterial({color:0xffff00})
  );
  dot.position.copy(pos);
  scene.add(dot);
}

function drawPath() {
  if (points.length < 2) return;

  if (line) scene.remove(line);

  line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({color:0x00ffff})
  );

  scene.add(line);
}

function finishScan() {
  if (points.length < 3) {
    overlay("Málo bodů");
    return;
  }

  // bounding box
  let minX=Infinity, maxX=-Infinity;
  let minZ=Infinity, maxZ=-Infinity;

  points.forEach(p=>{
    minX = Math.min(minX, p.x);
    maxX = Math.max(maxX, p.x);
    minZ = Math.min(minZ, p.z);
    maxZ = Math.max(maxZ, p.z);
  });

  const width = maxX - minX;
  const length = maxZ - minZ;
  const area = width * length;

  overlay(
    `Šířka: ${width.toFixed(2)} m | ` +
    `Délka: ${length.toFixed(2)} m | ` +
    `Plocha: ${area.toFixed(2)} m²`
  );
}

function overlay(t){
  document.getElementById('overlay').innerText = t;
}

function render(timestamp, frame) {

  if (!renderer.xr.isPresenting) {
    renderer.render(scene, camera);
    return;
  }

  if (frame) {
    const session = renderer.xr.getSession();
    const refSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({space}).then(source=>{
          hitTestSource = source;
        });
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);

        grid.visible = true;
        grid.position.copy(pos);

        if (scanning) {
          addPoint(pos);
          drawPath();
        }

      } else {
        reticle.visible = false;
        grid.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
