<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>AI + AR Dual Mode</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#ui {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
}

button {
  padding:10px;
  margin:5px;
  font-size:16px;
}

#overlay {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:white;
  padding:10px;
  border-radius:8px;
  z-index:20;
}

video {
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>
</head>

<body>

<div id="ui">
  <button onclick="startAI()">AI scan</button>
  <button onclick="startAR()">Start AR</button>
</div>

<div id="overlay">Vyber režim</div>
<video id="video" autoplay playsinline></video>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let model;
let video = document.getElementById("video");

let lastDetected = "žádný objekt";

// ===== AI MODE =====
window.startAI = async function() {

  overlay("Spouštím AI...");

  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });

  video.style.display = "block";
  video.srcObject = stream;

  await new Promise(r => video.onloadeddata = r);

  model = await cocoSsd.load();

  overlay("AI běží");

  aiLoop();
};

async function aiLoop() {

  if (!model) return;

  const predictions = await model.detect(video);

  if (predictions.length > 0) {
    lastDetected = predictions[0].class;
    overlay("Vidím: " + lastDetected);
  }

  requestAnimationFrame(aiLoop);
}

// ===== AR MODE =====
window.startAR = function() {

  video.srcObject = null;
  video.style.display = "none";

  overlay("Spusť AR tlačítkem");

  initAR();
};

function initAR() {

  let scene = new THREE.Scene();
  let camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  let renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  document.body.appendChild(
    ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    })
  );

  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

  let reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.08,0.1,32),
    new THREE.MeshBasicMaterial({ color:0x00ff00 })
  );
  reticle.rotation.x = -Math.PI/2;
  reticle.visible = false;
  scene.add(reticle);

  let hitTestSource = null;
  let localSpace = null;
  let viewerSpace = null;

  renderer.xr.addEventListener("sessionstart", async () => {

    const session = renderer.xr.getSession();

    viewerSpace = await session.requestReferenceSpace("viewer");
    localSpace = await session.requestReferenceSpace("local");

    hitTestSource = await session.requestHitTestSource({
      space: viewerSpace
    });

    overlay("Klepni pro vložení: " + lastDetected);
  });

  // TAP
  let lastTap = 0;

  window.addEventListener("touchstart", () => {

    const now = Date.now();
    if (now - lastTap < 400) return;
    lastTap = now;

    if (!reticle.visible) return;

    const label = createLabel(lastDetected);
    label.position.setFromMatrixPosition(reticle.matrix);

    scene.add(label);
  });

  renderer.setAnimationLoop((time, frame) => {

    if (frame && hitTestSource) {

      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {

        const pose = hits[0].getPose(localSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        reticle.matrix.decompose(
          reticle.position,
          reticle.quaternion,
          reticle.scale
        );

      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  });
}

// ===== LABEL =====
function createLabel(text) {

  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,256,128);

  ctx.fillStyle = "white";
  ctx.font = "24px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(text,128,64);

  const texture = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map:texture })
  );

  sprite.scale.set(0.4,0.2,1);

  return sprite;
}

// ===== UI =====
function overlay(t){
  document.getElementById("overlay").innerText = t;
}
</script>

</body>
</html>
