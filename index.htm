<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>AR Měření – FIX</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#overlay {
  position:absolute; top:20px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:#fff; padding:10px 16px;
  border-radius:8px; z-index:10;
}

#measureButton {
  position:absolute; bottom:20px; left:50%;
  transform:translateX(-50%);
  padding:12px 20px;
  background:#007aff; color:white;
  border:none; border-radius:8px;
  display:none; z-index:10;
}
</style>
</head>

<body>

<div id="overlay">Inicializace...</div>
<button id="measureButton">Změřit vzdálenost</button>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let scene, camera, renderer;
let reticle, grid;

let hitTestSource = null;
let hitTestSourceRequested = false;

let pointA=null, pointB=null;
let markers=[], line=null, textMesh=null;

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  document.body.appendChild(ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test','local-floor']
  }));

  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

  // reticle
  const geo = new THREE.RingGeometry(0.08,0.1,32);
  geo.rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0x00ffaa}));
  reticle.matrixAutoUpdate=false;
  reticle.visible=false;
  scene.add(reticle);

  // grid
  grid = new THREE.GridHelper(1,10,0x00ffaa,0x00ffaa);
  grid.visible=false;
  scene.add(grid);

  document.getElementById('measureButton').onclick = handleMeasure;

  renderer.xr.addEventListener('sessionstart', () => {
    document.getElementById('overlay').innerText = "Hledám podlahu...";
    document.getElementById('measureButton').style.display = 'block';
  });

  renderer.xr.addEventListener('sessionend', () => {
    hitTestSourceRequested = false;
    hitTestSource = null;

    renderer.setAnimationLoop(null);

    document.getElementById('overlay').innerText = "AR ukončeno";
    document.getElementById('measureButton').style.display = 'none';
  });

  renderer.setAnimationLoop(render);
}

function handleMeasure() {
  if (!reticle.visible) return;

  const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);

  if (!pointA) {
    pointA = pos.clone();
    addMarker(pointA);
    overlay("Vyber druhý bod");
  } else if (!pointB) {
    pointB = pos.clone();
    addMarker(pointB);
    createMeasurement();
    overlay("Hotovo");
    setTimeout(resetMeasurement,3000);
  }
}

function addMarker(pos) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.03),
    new THREE.MeshBasicMaterial({color:0x007aff})
  );
  m.position.copy(pos);
  scene.add(m);
  markers.push(m);
}

function createMeasurement() {
  line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([pointA,pointB]),
    new THREE.LineBasicMaterial({color:0xffffff})
  );
  scene.add(line);

  const dist = pointA.distanceTo(pointB);

  const canvas = document.createElement('canvas');
  canvas.width=512; canvas.height=256;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle="white";
  ctx.font="48px Arial";
  ctx.textAlign="center";
  ctx.fillText(dist.toFixed(2)+" m",256,130);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({map:new THREE.CanvasTexture(canvas)})
  );

  const mid = new THREE.Vector3().addVectors(pointA,pointB).multiplyScalar(0.5);
  mid.y += 0.05;

  sprite.position.copy(mid);
  sprite.scale.set(0.5,0.25,1);

  textMesh = sprite;
  scene.add(sprite);
}

function resetMeasurement() {
  pointA=null; pointB=null;

  markers.forEach(m=>scene.remove(m));
  markers=[];

  if(line) scene.remove(line);
  if(textMesh) scene.remove(textMesh);
}

function overlay(t){ document.getElementById('overlay').innerText=t; }

function render(timestamp, frame) {
  if (!renderer.xr.isPresenting) {
    renderer.render(scene, camera);
    return;
  }

  if (frame) {
    const session = renderer.xr.getSession();
    const refSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({space}).then(source=>{
          hitTestSource = source;
        });
      });

      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
        grid.visible = true;
        grid.position.copy(pos);

        overlay("Prostor detekován");
      } else {
        reticle.visible = false;
        grid.visible = false;
        overlay("Hledám podlahu...");
      }
    }
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
