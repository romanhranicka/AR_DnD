<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>TRUE AR – working tap</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; overflow:hidden; }

#overlay {
  position:absolute;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px;
  z-index:10;
}
</style>
</head>

<body>

<div id="overlay">Spusť AR a klepni na plochu</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let camera, scene, renderer;
let reticle;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.01,
    20
  );

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  document.body.appendChild(
    ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    })
  );

  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

  // ===== RETICLE =====
  const geometry = new THREE.RingGeometry(0.08, 0.1, 32);
  const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });

  reticle = new THREE.Mesh(geometry, material);
  reticle.rotation.x = -Math.PI / 2;
  reticle.visible = false;
  scene.add(reticle);

  let hitTestSource = null;
  let localSpace = null;
  let viewerSpace = null;

  // ===== XR SESSION =====
  renderer.xr.addEventListener("sessionstart", async () => {

    const session = renderer.xr.getSession();

    viewerSpace = await session.requestReferenceSpace("viewer");
    localSpace = await session.requestReferenceSpace("local");

    hitTestSource = await session.requestHitTestSource({
      space: viewerSpace
    });

    // ✅ SPRÁVNÝ TAP EVENT
    session.addEventListener("select", () => {

      if (!reticle.visible) {
        console.log("reticle není vidět");
        return;
      }

      console.log("XR tap OK");

      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.1, 0.1),
        new THREE.MeshStandardMaterial({ color: 0xff0000 })
      );

      // přesná pozice z reticle
      cube.position.setFromMatrixPosition(reticle.matrix);

      scene.add(cube);
    });

  });

  // ===== RENDER LOOP =====
  renderer.setAnimationLoop((time, frame) => {

    if (frame && hitTestSource) {

      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {

        const pose = hits[0].getPose(localSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        reticle.matrix.decompose(
          reticle.position,
          reticle.quaternion,
          reticle.scale
        );

      } else {
        reticle.visible = false;
      }
    }

    renderer.render(scene, camera);
  });
}
</script>

</body>
</html>
