<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>AR Měření vzdálenosti</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin: 0; overflow: hidden; font-family: Arial; }

    #overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      z-index: 10;
    }

    #startButton, #measureButton {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      color: white;
      z-index: 10;
    }

    #startButton { bottom: 80px; background: #00c896; }
    #measureButton { bottom: 20px; background: #007aff; display: none; }
  </style>
</head>

<body>

<div id="overlay">Hledám podlahu...</div>
<button id="startButton">Spustit AR</button>
<button id="measureButton">Změřit vzdálenost</button>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

let camera, scene, renderer;
let reticle, grid;
let hitTestSource = null;
let hitTestSourceRequested = false;

// měření
let pointA = null;
let pointB = null;
let markers = [];
let line = null;
let textMesh = null;

init();

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

  // reticle
  const geo = new THREE.RingGeometry(0.08, 0.1, 32);
  geo.rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0x00ffaa}));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // grid
  grid = new THREE.GridHelper(1,10,0x00ffaa,0x00ffaa);
  grid.visible = false;
  scene.add(grid);

  const startBtn = document.getElementById('startButton');
  const measureBtn = document.getElementById('measureButton');

  startBtn.onclick = async () => {
    const session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test','local-floor']
    });

    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);

    startBtn.style.display = 'none';
    measureBtn.style.display = 'block';

    renderer.setAnimationLoop(render);
  };

  measureBtn.onclick = handleMeasure;

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function handleMeasure() {
  if (!reticle.visible) return;

  const pos = new THREE.Vector3();
  pos.setFromMatrixPosition(reticle.matrix);

  if (!pointA) {
    pointA = pos.clone();
    addMarker(pointA);
    document.getElementById('overlay').innerText = "Vyber druhý bod";
  } else if (!pointB) {
    pointB = pos.clone();
    addMarker(pointB);
    createMeasurement();
    document.getElementById('overlay').innerText = "Měření dokončeno";
    
    // reset pro další měření
    setTimeout(resetMeasurement, 3000);
  }
}

function addMarker(position) {
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(0.03),
    new THREE.MeshBasicMaterial({color:0x007aff})
  );
  sphere.position.copy(position);
  scene.add(sphere);
  markers.push(sphere);
}

function createMeasurement() {
  // čára
  const geometry = new THREE.BufferGeometry().setFromPoints([pointA, pointB]);
  const material = new THREE.LineBasicMaterial({color:0xffffff});
  line = new THREE.Line(geometry, material);
  scene.add(line);

  // vzdálenost
  const distance = pointA.distanceTo(pointB);

  // text (canvas → textura)
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = "white";
  ctx.font = "48px Arial";
  ctx.textAlign = "center";
  ctx.fillText(distance.toFixed(2) + " m", 256, 130);

  const texture = new THREE.CanvasTexture(canvas);
  const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
  textMesh = new THREE.Sprite(spriteMaterial);

  const mid = new THREE.Vector3().addVectors(pointA, pointB).multiplyScalar(0.5);
  mid.y += 0.05;

  textMesh.position.copy(mid);
  textMesh.scale.set(0.5,0.25,1);

  scene.add(textMesh);
}

function resetMeasurement() {
  pointA = null;
  pointB = null;

  markers.forEach(m => scene.remove(m));
  markers = [];

  if (line) scene.remove(line);
  if (textMesh) scene.remove(textMesh);
}

function render(timestamp, frame) {
  if (frame) {
    const refSpace = renderer.xr.getReferenceSpace();
    const session = renderer.xr.getSession();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({space}).then(source=>{
          hitTestSource = source;
        });
      });

      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
        grid.visible = true;
        grid.position.copy(pos);

        document.getElementById('overlay').innerText = "Prostor detekován";
      } else {
        reticle.visible = false;
        document.getElementById('overlay').innerText = "Hledám podlahu...";
      }
    }
  }

  renderer.render(scene, camera);
}
</script>

</body>
</html>
