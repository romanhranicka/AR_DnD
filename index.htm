<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>AR Measure FIX 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { margin:0; overflow:hidden; font-family:Arial; }

#overlay {
  position:absolute; top:20px; left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  color:white; padding:10px 16px;
  border-radius:8px; z-index:10;
}
</style>
</head>

<body>
<div id="overlay">Spusť AR</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

let scene, camera, renderer;
let reticle, grid, controller;

let hitTestSource = null;
let hitTestSourceRequested = false;

let pointA = null;
let previewLine = null;

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  document.body.appendChild(ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test','local-floor']
  }));

  scene.add(new THREE.HemisphereLight(0xffffff,0xbbbbff,1));

  // reticle
  const geo = new THREE.RingGeometry(0.08,0.1,32);
  geo.rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0x00ffaa}));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  // grid
  grid = new THREE.GridHelper(1,10,0x00ffaa,0x00ffaa);
  grid.visible = false;
  scene.add(grid);

  // XR controller (!!! klíčové)
  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  renderer.setAnimationLoop(render);
}

function onSelect() {
  if (!reticle.visible) return;

  const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);

  if (!pointA) {
    pointA = pos.clone();
    addMarker(pointA);
    overlay("Vyber druhý bod");
  } else {
    addMarker(pos);

    createLine(pointA, pos);
    showDistance(pointA, pos);

    pointA = null;
    overlay("Hotovo – pokračuj");
  }
}

function addMarker(pos) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.025),
    new THREE.MeshBasicMaterial({color:0x007aff})
  );
  m.position.copy(pos);
  scene.add(m);
}

function createLine(a,b) {
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([a,b]),
    new THREE.LineBasicMaterial({color:0xffffff})
  );
  scene.add(line);
}

function showDistance(a,b) {
  const dist = a.distanceTo(b);

  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 256;

  const ctx = canvas.getContext('2d');
  ctx.fillStyle="white";
  ctx.font="48px Arial";
  ctx.textAlign="center";
  ctx.fillText(dist.toFixed(2)+" m",256,130);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({map:new THREE.CanvasTexture(canvas)})
  );

  const mid = new THREE.Vector3().addVectors(a,b).multiplyScalar(0.5);
  mid.y += 0.05;

  sprite.position.copy(mid);
  sprite.scale.set(0.5,0.25,1);

  scene.add(sprite);
}

function overlay(t) {
  document.getElementById('overlay').innerText = t;
}

function render(timestamp, frame) {
  if (!renderer.xr.isPresenting) {
    renderer.render(scene, camera);
    return;
  }

  if (frame) {
    const session = renderer.xr.getSession();
    const refSpace = renderer.xr.getReferenceSpace();

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({space}).then(source=>{
          hitTestSource = source;
        });
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hits = frame.getHitTestResults(hitTestSource);

      if (hits.length > 0) {
        const pose = hits[0].getPose(refSpace);

        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);

        const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
        grid.visible = true;
        grid.position.copy(pos);

        overlay("Tapni na obrazovku");
      } else {
        reticle.visible = false;
        grid.visible = false;
        overlay("Hledám podlahu...");
      }
    }
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
